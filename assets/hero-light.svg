  </g>
      <g class="field-rise"><text x="50" y="49" class="field-mono" font-size="8" letter-spacing="2.3" fill="#57626E">FIELD SPECIMEN / SYSTEMATIC INDEX</text><text x="50" y="82" class="field-label" font-size="12" font-weight="800" letter-spacing="2" fill="#BE4D0C">KRISHNADITYA SINGH</text>
      <text x="48" y="133" class="field-serif" font-size="36" font-weight="700" fill="#241B11">PRODUCTS AND</text><text x="48" y="169" class="field-serif" font-size="36" font-style="italic" fill="#241B11">DETECTION SYSTEMS</text>
      <path d="M50 210H132" stroke="#34637D" stroke-width="4"/><text x="50" y="238" class="field-label" font-size="11" fill="#706050">Shipping products end to end. Now building Saathi and JARVIS.</text>
      <text x="50" y="276" class="field-mono" font-size="8" letter-spacing="1.5" fill="#241B11">02 SPECIMENS · 02 CLASSIFIED LAYERS</text></g>
      <text x="763" y="47" class="field-serif" font-size="16" font-style="italic" fill="#241B11">Pinned systems</text><text x="1142" y="47" text-anchor="end" class="field-mono" font-size="8" letter-spacing="1.4" fill="#706050">CATALOG / KRISHNADITYASINGH18-C…</text><g class="field-rise" style="animation-delay:100ms">
        <path d="M625 151.5C668 151.5 691 70 733 70" fill="none" stroke="#BE4D0C" stroke-opacity=".72"/><path class="field-trace" d="M625 151.5C668 151.5 691 70 733 70" fill="none" stroke="#57626E" stroke-width="1.5"/>
        <g transform="translate(741 70)"><use class="field-pin" style="animation-delay:0.00s" href="#field-specimen-pin"/></g>
        <text x="763" y="66" class="field-label" font-size="12" font-weight="800" fill="#241B11">Versio</text><text x="1142" y="66" text-anchor="end" class="field-mono" font-size="7.5" letter-spacing="1.3" fill="#BE4D0C">WEB APP</text>
        <text x="763" y="83" class="field-label" font-size="8.7" fill="#706050">Version history and review-first collaboration, no Git.</text><path d="M763 92H1142" stroke="#B1A58C"/>
      </g><g class="field-rise" style="animation-delay:155ms">
        <path d="M625 160.5C668 160.5 691 114 733 114" fill="none" stroke="#34637D" stroke-opacity=".72"/><path class="field-trace" d="M625 160.5C668 160.5 691 114 733 114" fill="none" stroke="#57626E" stroke-width="1.5"/>
        <g transform="translate(741 114)"><use class="field-pin" style="animation-delay:0.31s" href="#field-specimen-pin"/></g>
        <text x="763" y="110" class="field-label" font-size="12" font-weight="800" fill="#241B11">routine-guard</text><text x="1142" y="110" text-anchor="end" class="field-mono" font-size="7.5" letter-spacing="1.3" fill="#34637D">PYTHON LIBRARY</text>
        <text x="763" y="127" class="field-label" font-size="8.7" fill="#706050">Flags late starts, silences and odd-hour activity.</text><path d="M763 136H1142" stroke="#B1A58C"/>
